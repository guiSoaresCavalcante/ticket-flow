services:
  eureka-srv:
    build: ./eureka-srv
    container_name: eureka-srv
    ports:
      - "${EUREKA_SRV_PORT:-8761}:${EUREKA_SRV_PORT:-8761}"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SPRING_APPLICATION_NAME: ${EUREKA_SRV_APPLICATION_NAME:-eureka-srv}
      SERVER_PORT: ${EUREKA_SRV_PORT:-8761}
      EUREKA_INSTANCE_HOSTNAME: ${EUREKA_INSTANCE_HOSTNAME:-eureka-srv}
      EUREKA_REGISTER_WITH_EUREKA: ${EUREKA_REGISTER_WITH_EUREKA:-false}
      EUREKA_FETCH_REGISTRY: ${EUREKA_FETCH_REGISTRY:-false}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL:-http://eureka-srv:8761/eureka/}

  user-srv:
    build: ./user-srv
    container_name: user-srv
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SPRING_APPLICATION_NAME: ${USER_SRV_APPLICATION_NAME:-user-srv}
      DB_URL: ${USER_SRV_DB_URL:-jdbc:h2:mem:user-srv;DB_CLOSE_DELAY=-1}
      DB_DRIVER_CLASS_NAME: ${DB_DRIVER_CLASS_NAME:-org.h2.Driver}
      DB_USERNAME: ${DB_USERNAME:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-}
      H2_CONSOLE_ENABLED: ${H2_CONSOLE_ENABLED:-true}
      H2_CONSOLE_PATH: ${H2_CONSOLE_PATH:-/h2-console}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-true}
      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL:-true}

  auth-srv:
    build: ./auth-srv
    container_name: auth-srv
    ports:
      - "${AUTH_SRV_PORT:-8081}:${AUTH_SRV_PORT:-8081}"
    depends_on:
      - eureka-srv
      - user-srv
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SPRING_APPLICATION_NAME: ${AUTH_SRV_APPLICATION_NAME:-auth-srv}
      SERVER_PORT: ${AUTH_SRV_PORT:-8081}
      DB_URL: ${AUTH_SRV_DB_URL:-jdbc:h2:mem:auth-srv;DB_CLOSE_DELAY=-1}
      DB_DRIVER_CLASS_NAME: ${DB_DRIVER_CLASS_NAME:-org.h2.Driver}
      DB_USERNAME: ${DB_USERNAME:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-}
      H2_CONSOLE_ENABLED: ${H2_CONSOLE_ENABLED:-true}
      H2_CONSOLE_PATH: ${H2_CONSOLE_PATH:-/h2-console}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-true}
      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL:-true}
      USER_SRV_BASE_URL: ${USER_SRV_BASE_URL:-http://user-srv:8080}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL:-http://eureka-srv:8761/eureka/}
      JWT_SECRET: ${JWT_SECRET:-VUt/fTSgVhf7hatedaa5Rlxna72rT3NjB2L8dqAOlju1g8Y99nLBqpwITsPYykGz}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: ticket-flow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  event-srv:
    build: ./event-srv
    container_name: event-srv
    ports:
      - "${EVENT_SRV_PORT:-8083}:${EVENT_SRV_PORT:-8083}"
    depends_on:
      eureka-srv:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SPRING_APPLICATION_NAME: ${EVENT_SRV_APPLICATION_NAME:-event-srv}
      SERVER_PORT: ${EVENT_SRV_PORT:-8083}
      DB_URL: ${EVENT_SRV_DB_URL:-jdbc:h2:mem:event-srv;DB_CLOSE_DELAY=-1}
      DB_DRIVER_CLASS_NAME: ${DB_DRIVER_CLASS_NAME:-org.h2.Driver}
      DB_USERNAME: ${DB_USERNAME:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-}
      H2_CONSOLE_ENABLED: ${H2_CONSOLE_ENABLED:-true}
      H2_CONSOLE_PATH: ${H2_CONSOLE_PATH:-/h2-console}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-true}
      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL:-true}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL:-http://eureka-srv:8761/eureka/}
      JWT_SECRET: ${JWT_SECRET:-VUt/fTSgVhf7hatedaa5Rlxna72rT3NjB2L8dqAOlju1g8Y99nLBqpwITsPYykGz}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC_EVENT_ATTENDANCE: ${KAFKA_TOPIC_EVENT_ATTENDANCE:-event-attendance}

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8082}:${API_GATEWAY_PORT:-8082}"
    depends_on:
      - eureka-srv
      - auth-srv
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SPRING_APPLICATION_NAME: ${API_GATEWAY_APPLICATION_NAME:-api-gateway}
      SERVER_PORT: ${API_GATEWAY_PORT:-8082}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL:-http://eureka-srv:8761/eureka/}
