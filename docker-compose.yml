services:
  eureka-srv:
    build: ./eureka-srv
    container_name: eureka-srv
    ports:
      - "${EUREKA_SRV_PORT}:${EUREKA_SRV_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_APPLICATION_NAME: ${EUREKA_SRV_APPLICATION_NAME}
      SERVER_PORT: ${EUREKA_SRV_PORT}
      EUREKA_INSTANCE_HOSTNAME: ${EUREKA_INSTANCE_HOSTNAME}
      EUREKA_REGISTER_WITH_EUREKA: ${EUREKA_REGISTER_WITH_EUREKA}
      EUREKA_FETCH_REGISTRY: ${EUREKA_FETCH_REGISTRY}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL}

  user-srv:
    build: ./user-srv
    container_name: user-srv
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_APPLICATION_NAME: ${USER_SRV_APPLICATION_NAME}
      DB_URL: ${USER_SRV_DB_URL}
      DB_DRIVER_CLASS_NAME: ${DB_DRIVER_CLASS_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      H2_CONSOLE_ENABLED: ${H2_CONSOLE_ENABLED}
      H2_CONSOLE_PATH: ${H2_CONSOLE_PATH}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL}
      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL}

  auth-srv:
    build: ./auth-srv
    container_name: auth-srv
    ports:
      - "${AUTH_SRV_PORT}:${AUTH_SRV_PORT}"
    depends_on:
      - eureka-srv
      - user-srv
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_APPLICATION_NAME: ${AUTH_SRV_APPLICATION_NAME}
      SERVER_PORT: ${AUTH_SRV_PORT}
      DB_URL: ${AUTH_SRV_DB_URL}
      DB_DRIVER_CLASS_NAME: ${DB_DRIVER_CLASS_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      H2_CONSOLE_ENABLED: ${H2_CONSOLE_ENABLED}
      H2_CONSOLE_PATH: ${H2_CONSOLE_PATH}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL}
      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL}
      USER_SRV_BASE_URL: ${USER_SRV_BASE_URL}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS}

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: ticket-flow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  event-srv:
    build: ./event-srv
    container_name: event-srv
    ports:
      - "${EVENT_SRV_PORT}:${EVENT_SRV_PORT}"
    depends_on:
      eureka-srv:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_APPLICATION_NAME: ${EVENT_SRV_APPLICATION_NAME}
      SERVER_PORT: ${EVENT_SRV_PORT}
      DB_URL: ${EVENT_SRV_DB_URL}
      DB_DRIVER_CLASS_NAME: ${DB_DRIVER_CLASS_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      H2_CONSOLE_ENABLED: ${H2_CONSOLE_ENABLED}
      H2_CONSOLE_PATH: ${H2_CONSOLE_PATH}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL}
      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_EVENT_ATTENDANCE: ${KAFKA_TOPIC_EVENT_ATTENDANCE}

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    depends_on:
      - eureka-srv
      - auth-srv
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_APPLICATION_NAME: ${API_GATEWAY_APPLICATION_NAME}
      SERVER_PORT: ${API_GATEWAY_PORT}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL}

  notification-srv:
    build: ./norification-srv
    container_name: notification-srv
    depends_on:
      kafka:
        condition: service_healthy
      user-srv:
        condition: service_started
      event-srv:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_APPLICATION_NAME: ${NOTIFICATION_SRV_APPLICATION_NAME}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CONSUMER_GROUP_ID: ${NOTIFICATION_SRV_KAFKA_GROUP_ID}
      KAFKA_TOPIC_EVENT_ATTENDANCE: ${KAFKA_TOPIC_EVENT_ATTENDANCE}
      USER_SRV_BASE_URL: ${USER_SRV_BASE_URL}
      EVENT_SRV_BASE_URL: ${EVENT_SRV_BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
